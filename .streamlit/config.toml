# A BI-felület beállításai — `streamlit run ui/app.py` esetén ez érvényes;
# a `python -m ui` ugyanezeket parancssorból is átadja (ui/__main__.py).

[server]
address = "localhost"       # csak ezen a gépen érhető el, a hálózatról nem
showEmailPrompt = false     # az első indítás ne kérjen e-mail-címet

[browser]
gatherUsageStats = false    # nem küld használati statisztikát

[client]
toolbarMode = "minimal"     # a fejlesztői menü (Deploy stb.) rejtve
