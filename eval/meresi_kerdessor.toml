# Mérési kérdéssor a nyelvi réteghez (K1, F-1, F-2) — a dolgozat számai ezen készülnek.
#
# ÁLLAPOT: 130 kérdés — Claude 80 (k001–k080, 2026-10-16 délelőtt), Baranyi Viola 50
# (k081–k130, a saját szavaival, mielőtt Claude kérdéseit látta volna). Az elvárt értelmezést
# Viola kérdéseihez is Claude írta, és Viola ellenőrzi, hogy azt értette-e alatta. Utána a
# készlet LEZÁRUL: a fájl ujjlenyomata (SHA256, egységesített sorvégekkel) bekerül a K1
# protokollba (docs/k1_protokoll.json), és onnantól a fájl nem változik.
#
# Szabályok
#   * Lezárás előtt egyetlen kérdés sem fut valódi nyelvi modellen (a felületen sem): ha
#     látnánk, mit ront el rajtuk a modell, a kódot ezekhez igazítanánk, és az már nem mérés.
#   * A fejlesztői próbasor (eval/fejlesztoi_kerdessor.toml), a prompt mintapéldái és a
#     felület példakérdései itt nem szerepelnek, és közeli átfogalmazásuk sem.
#   * A mérés kódja és promptja a mérés előtt rögzül (git commit a jelentésben); ha utána
#     változik, az új változat a teljes készleten újra fut, és mindkét eredmény a dolgozatba
#     kerül.
#
# Összetétel: 102 megválaszolandó + 28 csapda (22%). A rendszerterv 80 kérdést és 15
# csapdát írt; a nagyobb készlet szűkebb intervallumot ad. A tervezett 120 helyett 130: Viola
# 51 kérdést írt, és nem Claude válogatott közülük (egy a fejlécbeli szabály miatt kimaradt).
#
# Egy kérdés elvárt értelmezése (kanonikus gépi alak, ugyanúgy normalizálva, mint a kapuban):
#   metrika    — azonosító, vagy több elfogadható listája (ha a kérdés tényleg kétféleképp érthető)
#   bontas     — a bontás; üres lista: nincs
#   szuro      — dimenzió → kanonikus értékek; üres tábla: NINCS szűrő (a kitalált szűrő hiba)
#   tol, ig    — az időablak; üres szöveg: az adat széle (a kitalált időablak hiba)
#   rendezes   — csak ha a kérdés meghatározza; lista: bármelyik jó
#   limit      — csak ha a kérdés megmondja, hány csoport kell
#   teljes     — idősornál / a hét napjainál: természetes sorrendben a teljes sor kell
#                (ha a „limit” levágja a sor végét, az hibás értelmezés)
#   idoablak = "barmely" — az időablakot nem nézi („mostanában”)
#   alternativak — elfogadható másik értelmezés(ek): a felsorolt mezők felülírják a fő
#                elvárást (pl. „bútor” = a fő bútorkategória vagy mind a hat)
#   elutasitas — az elvárt elutasítás kódja, lista: bármelyik jó, „*”: bármilyen elutasítás jó
#   csapda     — a csapda fajtája (a jelentés fajtánként is összesít)
#   tipus      — osszesito | rangsor | szures | idoszak | idosor | kombinalt | nyelvi | csapda
#   csapda     — nincs_adat | jovo | adaton_kivul | katalogus_kivul | tiltott | korlat |
#                atveres | nem_adat | ketertelmu | tobblepeses
#
# A rendszer „mai” napja 2018-09-01 (katalógus: szimulalt_ma): „tavaly” = 2017, „idén” =
# 2018. január 1. – augusztus 31., „az elmúlt hat hónap” = 2018. március 1. – augusztus 31.

