# Fejlesztői próbasor a nyelvi réteghez — HANGOLÁSRA, nem mérésre.
#
# Ezen a soron szabad a promptot és a kódot igazítani: arra való, hogy egy változtatás után
# gyorsan látszódjon, jobb lett-e az értelmezés, és mennyi idő megy el. A dolgozat számai (K1,
# K3, K4) a később lezárt, 120 kérdéses kérdéssoron készülnek; abban ezek a kérdések szó
# szerint nem szerepelhetnek (különben a hangolás a mérést is „megtanulná”).
#
# Futtatás:   uv run python -m narrative.proba
#             uv run python -m narrative.proba --csak-ertelmezes      (csak az ① hívás)
#             uv run python -m narrative.proba --kerdes f03 --kerdes f11
# Jelentés:   logs/proba_ÉÉÉÉHHNN_ÓÓPPMM.md és .json
#
# Egy kérdés elvárt értelmezése a kanonikus gépi alakban (a kapu normalizálása után):
#   metrika   — egy azonosító, vagy több elfogadható listája
#   bontas    — a bontás (üres lista: nincs)
#   szuro     — dimenzió → kanonikus értékek (sorrend nem számít)
#   tol, ig   — az időablak (ugyanúgy normalizálva, mint a kapuban)
#   rendezes, limit — csak ha a kérdés egyértelműen meghatározza
#   elutasitas — az elvárt elutasítás kódja („*”: bármilyen elutasítás jó)
# Amit egy kérdés nem ad meg, azt a próba nem nézi.

[[kerdes]]
id = "f01"
kerdes = "Melyik régióban késnek a legtöbbet?"
metrika = "kesesi_arany"
bontas = ["vevo_regio"]
rendezes = "ertek_csokkeno"

[[kerdes]]
id = "f02"
kerdes = "Hogyan alakult a forgalom havonta 2017-ben?"
metrika = "forgalom"
bontas = ["honap"]
tol = "2017-01-01"
ig = "2017-12-31"
rendezes = "bontas"

[[kerdes]]
